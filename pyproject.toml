[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-obd2"
version = "0.1.0"
description = "A practical OBD2 diagnostic tool for live data, trouble codes, and snapshots."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Daron Fritts" }
]
dependencies = [
  "click>=8.1",
  "obd>=0.7.2",
  "pyserial>=3.5",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
fox-obd2 = "fox_obd2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
